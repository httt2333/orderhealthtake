<div id="app"></div>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<script type="module">
/**
 * Domain model and safe deterministic comparison engine.
 * DISCLAIMER: This is a document-diff demo with FICTITIOUS medications,
 * not a clinical medication reconciliation system.
 */
const KINDS = {
  changed: { label: '资料有调整', icon: 'refresh', tone: 'amber', short: '调整' },
  explicit_added: { label: '新资料出现', icon: 'plus-circle', tone: 'blue', short: '新增' },
  explicit_stopped: { label: '新资料明确提及停止', icon: 'minus-circle', tone: 'amber', short: '注明停止' },
  unchanged: { label: '已比对字段未见差异', icon: 'check', tone: 'neutral', short: '无变化' },
  missing_in_new: { label: '新资料未提及', icon: 'help-circle', tone: 'red', short: '未提及' },
  ambiguous: { label: '需要进一步核实', icon: 'alert-circle', tone: 'red', short: '待核实' }
};
const clean = v => (v == null ? '' : String(v).trim().replace(/\s+/g, ' ').normalize('NFKC'));
const fldLabels = {strengthText:'规格',doseText:'一次数量',frequencyText:'次数安排',timeText:'时间',startDate:'开始日期',endDate:'结束日期'};
const uid=()=>'diff-'+Math.random().toString(36).slice(2,8);
const evidenceOf=(e)=> e?.evidence?.length?e.evidence:[{sourceId:e?.sourceId||'unknown',rawSpan:'原文待核对'}];
function compareMedications(oldEntries=[], newEntries=[], options={}) {
 const used = new Set(), results=[];
 for(const old of oldEntries){
  // Match strictly by stable fixture key (same fictitious drug). Never assume similar names/specs same drug.
  const match=newEntries.find(n=>!used.has(n.id)&&n.matchKey&&old.matchKey&&n.matchKey===old.matchKey);
  if(!match){
   results.push(make('missing_in_new',old,null,[],['new_not_mentioned'],true,'新药单没提到，不能确定停用。'));
   continue;
  }
  used.add(match.id);
  const changes=Object.keys(fldLabels).filter(k=>clean(old[k])!==clean(match[k])).map(k=>({field:fldLabels[k],oldText:old[k]??null,newText:match[k]??null}));
  let kind='unchanged', reasons=[], needs=false;
  const missingCritical=(!clean(match.displayName)||!clean(match.timeText)||!clean(match.doseText));
  if(old.matchKey && match.matchKey && (clean(old.strengthText)&&clean(match.strengthText)&&clean(old.strengthText)!==clean(match.strengthText))) {
    kind='ambiguous';reasons.push('strength_conflict');needs=true;
  }
  else if((match.uncertainFields||[]).length||missingCritical||options.conflict){kind='ambiguous';reasons.push('uncertain_or_incomplete');needs=true;}
  else if(match.explicitAction==='stop' && (match.evidence||[]).some(x=>/停用|停止|停服/.test(x.rawSpan||''))){kind='explicit_stopped';reasons.push('explicit_source_stop');needs=true;}
  else if(changes.length){kind='changed';reasons.push('document_field_changed');needs=true;}
  else {kind='unchanged';reasons.push('compared_fields_same');}
  const explain = kind==='ambiguous' ? '这里不清楚，先核对一下。'
      :kind==='explicit_stopped'?'新版资料注明停止，请核对。'
      :kind==='changed'?'这项安排发生变化。'
      :'这项安排没有变化。';
  results.push(make(kind,old,match,changes,reasons,needs,explain));
 }
 for(const n of newEntries){if(used.has(n.id))continue;
  let kind=(!clean(n.displayName)||!clean(n.doseText)||(n.uncertainFields||[]).length||options.newDocumentCompleteness!=='complete_list')?'ambiguous':'explicit_added';
  results.push(make(kind,null,n,[],[kind==='ambiguous'?'incomplete_or_unmatched':'new_entry'],true,
    kind==='ambiguous'?'新资料出现一项无法确定身份或资料完整性的记录，需要继续核实。':'新药单多了这一项，请核对。'));
 }
 if(options.effectiveDateMissing || options.sourceConflict) {
  results.push({id:'diff-source-'+(options.sourceConflict?'conflict':'date'),kind:'ambiguous',displayName: '资料来源 / 日期',oldEntryId:null,newEntryId:null,fieldChanges:[],sourceEvidence:[],requiresProfessionalClarification:true,reasonCodes:[options.sourceConflict?'source_conflict':'effective_date_missing'],elderExplanation:'资料日期不清楚，请核对。'});
 }
 return results;
}
function make(kind,old,nw,changes,reasons,needs,elderExplanation){return {id:`diff-${old?.matchKey||nw?.matchKey||uid()}`,kind,displayName:nw?.displayName||old?.displayName||'未知项目',oldEntryId:old?.id||null,newEntryId:nw?.id||null,oldEntry:old||null,newEntry:nw||null,fieldChanges:changes,sourceEvidence:[...evidenceOf(old),...evidenceOf(nw)].filter(x=>x.sourceId!=='unknown'),requiresProfessionalClarification:needs,reasonCodes:reasons,elderExplanation};}
function statsOf(differences=[]) {return {changes:differences.filter(x=>x.kind==='changed'||x.kind==='explicit_added'||x.kind==='explicit_stopped').length, questions:differences.filter(x=>x.requiresProfessionalClarification).length, unchanged:differences.filter(x=>x.kind==='unchanged').length, total:differences.length};}
function unresolvedQuestions(diffs=[]){return diffs.filter(x=>x.requiresProfessionalClarification).map(d=>({id:d.id,name:d.displayName,text:d.kind==='missing_in_new'?`旧记录有“${d.displayName}”，新资料没有提到。请确认是否继续。`:d.kind==='ambiguous'?`“${d.displayName}”的资料不完整或互相矛盾，请确认正确记录和生效时间。`:`关于“${d.displayName}”，新旧资料存在差异。请确认哪个版本及何时适用。`}));}
const FIXTURES = {
 normal:{name:'01 · 常规变化',sub:'时间调整、新项目与未变化项',tone:'green',old:[med('A','模拟药A','早上','一份','每天'),med('C','模拟药C','晚上','一份','每天')],new:[med('A','模拟药A','晚上','一份','每天'),med('C','模拟药C','晚上','一份','每天'),med('D','模拟药D','中午','一份','每天','start')],complete:'complete_list'},
 missing:{name:'02 · 新资料遗漏',sub:'旧记录有药B，新文件未提及',tone:'amber',old:[med('A','模拟药A','早上','一份','每天'),med('B','模拟药B','晚上','一份','每天')],new:[med('A','模拟药A','早上','一份','每天')],complete:'partial'},
 conflict:{name:'03 · 信息冲突',sub:'规格和时间不一致',tone:'red',old:[med('A','模拟药A','早上','一份','每天','', '1单位')],new:[med('A','模拟药A','晚上','一份','每天','','2单位')],complete:'unknown',sourceConflict:true},
 unreadable:{name:'04 · 识别不清',sub:'资料有无法辨认的字段',tone:'red',old:[med('A','模拟药A','早上','一份','每天')],new:[{...med('A','模拟药A',null,'一份','每天'),uncertainFields:['timeText']}],complete:'unknown'},
 nohelp:{name:'05 · 尚无协助',sub:'没有准备旧版资料',tone:'amber',old:[],new:[],complete:'unknown',startEmpty:true},
 speechOff:{name:'06 · 语音关闭',sub:'完全通过按钮与字幕完成',tone:'blue',old:[med('A','模拟药A','早上','一份','每天')],new:[med('A','模拟药A','晚上','一份','每天')],complete:'complete_list',speechOff:true},
 aiError:{name:'07 · AI 不可用',sub:'展示失败和手录替代路径',tone:'red',old:[],new:[],complete:'unknown',aiError:true,startEmpty:true},
 replay:{name:'08 · 历史回看',sub:'完整案例回看示例',tone:'green',old:[med('A','模拟药A','早上','一份','每天')],new:[med('A','模拟药A','晚上','一份','每天')],complete:'complete_list',preComplete:true}
};
function med(key,name,time,dose,frequency='每天',explicitAction=null,strength='模拟规格'){return {id:`${key}-${time==='早上'?'old':'entry'}-${Math.random().toString(36).slice(2,4)}`,matchKey:key,displayName:name,form:'模拟剂型',strengthText:strength,doseText:dose,frequencyText:frequency,timeText:time,startDate:null,endDate:null,explicitAction,evidence:[{sourceId:'',rawSpan:`${name}：${frequency}，${time||'时间不清'}，${dose}`}],transcriptionStatus:'unreviewed',uncertainFields:[]};}
function createCase(scenario='normal'){
 const f=FIXTURES[scenario]||FIXTURES.normal;const n=Date.now(),id=`case-${n}`;
 const older=f.old.map((e,i)=>({...e,id:`old-${i}-${id}`,sourceId:`old-${id}`,evidence:[{sourceId:`old-${id}`,rawSpan:e.evidence[0].rawSpan}]}));
 const newer=f.new.map((e,i)=>({...e,id:`new-${i}-${id}`,sourceId:`new-${id}`,evidence:[{sourceId:`new-${id}`,rawSpan:e.evidence[0].rawSpan}]}));
 const docs = f.startEmpty?[]:[
 {id:`old-${id}`,sourceKind:'prior_confirmed_record',label:'旧版已记录安排（虚构）',authoredDate:'2026-10-01',effectiveDate:'2026-10-01',completeness:'complete_list',rawText:older.map(e=>e.evidence[0].rawSpan).join('\n'),extractionMode:'mock_fixture',demoData:true},

const DEFAULT={role:'elder',case:createCase('normal'),history:[],plan:[],taken:{},reminderSeen:{},settings:{large:false,slow:true,speech:true},activeDiffIndex:0,viewMode:'mock'};
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));return x&&x.case?{...DEFAULT,...x,settings:{...DEFAULT.settings,...x.settings}}:DEFAULT;}catch{return DEFAULT;}}
let st=load(), tempFileName=null, toastTimer=null;
function save(){st.case.updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE,JSON.stringify(st));return true;}catch{toast('本机空间不足，未能保存。请减少照片后重试');return false;}}
function setState(changes){st={...st,...changes};save();render();}
function patchCase(changes){st.case={...st.case,...changes};save();render();}
function moveTo(url){location.hash=url.startsWith('#')?url:'#'+url;window.scrollTo({top:0,behavior:'instant'});render();}
function currentPath(){return decodeURIComponent(location.hash.slice(1)||'/');}

 const docs=[...c.documents.filter(d=>d.id!==sourceId),doc],meds=[...c.medications.filter(m=>m.sourceId!==sourceId),...parsed];patchCase({documents:docs,medications:meds,differences:[],workflowStatus:'TRANSCRIPTION_REVIEW'});toast('已保存模拟资料。请到下一步核对转录文字。');}

function copiedText(){const c=currentCase(),s=statsOf(c.differences);return `安心药盒｜核对记录\n${date(c.createdAt)}｜虚构演示数据\n明显变化 ${s.changes} 处；待专业核实 ${s.questions} 项。\n\n资料差异：\n${c.differences.map(x=>`${x.displayName}：${KINDS[x.kind]?.label}。${x.elderExplanation}`).join('\n')}\n\n待专业核实：\n${unresolvedQuestions(c.differences).map(x=>`• ${x.text}`).join('\n')}`}
async function handleAction(button){const act=button.dataset.action, c=currentCase();
 if(act==='voice-field'){const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRec)return toast('请手动填写');if(activeRecognition){activeRecognition.stop();return;}const input=document.querySelector(`input[name="${button.dataset.fieldName}"]`),status=document.getElementById('solo-voice-status');if(!input)return;try{const rec=new SpeechRec();activeRecognition=rec;rec.lang='zh-CN';rec.interimResults=false;rec.onstart=()=>{if(status)status.textContent='● 正在听…';button.classList.add('listening');};rec.onresult=e=>{const spoken=e.results?.[0]?.[0]?.transcript?.trim();if(spoken){input.value=spoken;if(status)status.textContent='已填写，请检查';}};rec.onerror=()=>{if(status)status.textContent='没听清，试试手动填写';};rec.onend=()=>{activeRecognition=null;button.classList.remove('listening');if(status&&status.textContent==='● 正在听…')status.textContent='已结束';};rec.start();}catch{activeRecognition=null;toast('麦克风暂时不可用');}return;}
 if(act==='use-package-example'){const x=PACKAGE_EXAMPLES.find(x=>x.id===button.dataset.exampleId);if(!x)return;st.editingPlanId=null;st.draftPlan={id:`example-${Date.now()}-${x.id}`,name:x.name,boxPhoto:x.imageData,dose:'',time:'',demoCaseId:x.id,recognitionMode:'curated_example',demo:true};if(save())moveTo('/elder/edit-plan');return;}
 if(act==='new-plan'){st.editingPlanId=null;st.draftPlan=null;save();moveTo('/elder/edit-plan');return;}
 if(act==='confirm-plan'){const draft=st.draftPlan;if(!draft)return toast('请先填写用药安排');if(!boxPhoto(draft)){moveTo('/elder/edit-plan');return toast('请先拍下对应的药盒');}const previous=st.plan;st.plan=[...(st.plan||[]).filter(x=>x.id!==draft.id),{...draft,source:'self_entered'}];st.draftPlan=null;if(!save()){st.plan=previous;st.draftPlan=draft;return;}st.editingPlanId=null;save();moveTo('/elder/today');toast('已加入今天的用药安排');return;}
 if(act==='sample-plan'){st.plan=samplePlan();st.taken={};st.reminderSeen={};save();moveTo('/elder/today');toast('示例已准备好');return;}
 if(act==='toggle-taken'||act==='toggle-unsure'){const id=button.dataset.id,k=`${dayKey()}:${id}`,kind=act==='toggle-taken'?'self_report':'uncertain',current=st.taken[k];if(current?.kind===kind)delete st.taken[k];else st.taken[k]={at:new Date().toISOString(),kind};save();render();return;}
 if(act==='edit-plan'){st.draftPlan=null;st.editingPlanId=button.dataset.id;save();moveTo('/elder/edit-plan');return;}
 if(act==='delete-plan'){st.plan=(st.plan||[]).filter(x=>x.id!==button.dataset.id);save();render();toast('已删除');return;}
 if(act==='read-plan'||act==='read-draft'){const x=act==='read-draft'?st.draftPlan:(st.plan||[]).find(x=>x.id===button.dataset.id);if(x)speak(`${x.time}，${x.name}，每次${x.dose}。请核对手中的药盒。`,button);return;}
 if(act==='read-today'){const xs=planSorted();speak(xs.length?xs.map(x=>`${x.time}，${x.name}，${x.dose}。`).join(' '):'还没有用药安排');return;}
 if(act==='test-reminder'){const x=planSorted()[0];if(x)localReminder(`请看看用药安排：${x.name}，${x.dose}。`);return;}
 if(act==='enable-notify'){if(!('Notification' in window)){toast('此浏览器不支持通知');return;}try{const result=await Notification.requestPermission();toast(result==='granted'?'已开启浏览器通知':'未开启通知');render();}catch{toast('通知暂时不可用');}return;}
 if(act==='stop-speech'){stopReading();toast('已停止朗读。');return;}
 if(act==='toggle-role')return moveTo(currentPath().startsWith('/family')?'/elder/home':'/family/dashboard');
 if(act==='toggle-large'||act==='toggle-speech'||act==='toggle-slow'){const field=act.replace('toggle-','');st.settings[field]=!st.settings[field];save();render();return;}
 if(act==='repeat-card'){const m=currentPath().match(/changes\/(\d+)/),i=m?+m[1]:0,d=c.differences[i];if(d)speak(`${d.displayName}：${d.elderExplanation}`);return;}
 if(act==='load-normal'){st.case=createCase('normal');save();render();toast('已载入完整虚构示例，请逐项检查转录。');return;}
 if(act==='choose-scenario'){st.case=createCase(button.dataset.scenario);if(button.dataset.scenario==='speechOff')st.settings.speech=false;else st.settings.speech=true;save();render();toast('已加载：'+FIXTURES[button.dataset.scenario].name);return;}
 if(act==='reset-data'){if(confirm('确定清除本地虚构案例及演示历史吗？')){localStorage.removeItem(STORAGE);st={...DEFAULT,case:createCase('normal'),history:[],settings:{large:false,slow:true,speech:true}};save();render();toast('本地演示资料已重置。');}return;}
 if(act==='check-demo-all'){if(!c.demoData)return toast('此按钮仅用于虚构示例。');st.case={...c,medications:c.medications.map(x=>({...x,transcriptionStatus:'transcription_checked'}))};save();render();toast('文字已核对');return;}
 if(act==='mark-reviewed'){const id=button.dataset.medId;st.case={...c,medications:c.medications.map(x=>{if(x.id!==id)return x;if(x.transcriptionStatus==='transcription_checked')return {...x,transcriptionStatus:'unreviewed'};if(!x.displayName||!x.doseText||!x.timeText||x.uncertainFields?.length){toast('这一项缺少关键字段，不能标为转录完整。请先处理无法辨认的内容。');return {...x,transcriptionStatus:'needs_source_review'};}return {...x,transcriptionStatus:'transcription_checked'};})};save();render();return;}
 if(act==='proceed-compare'){if(!allTranscriptionsChecked(c))return toast('请先完成逐条文字检查。');return moveTo('/family/compare');}
 if(act==='run-compare'){const result=runCompare(c);if(result.error)return toast(result.error);patchCase({differences:result.differences,workflowStatus:'DIFF_READY'});toast('对比好了');return;}
 if(act==='copy-summary'){try{await navigator.clipboard.writeText(copiedText());toast('清单文字已经复制，可粘贴给需要核对的人。');}catch{const ta=document.createElement('textarea');ta.value=copiedText();document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('清单文字已复制。');}catch{toast('复制失败，请使用浏览器选中文本复制。');}ta.remove();}return;}
 if(act==='print'){window.print();return;}
 if(act==='archive'){if(!c.differences.length)return toast('没有可保存的核对结果。');if(!st.history.some(x=>x.id===c.id))st.history.unshift({...c,workflowStatus:'ARCHIVED'});st.case={...c,workflowStatus:'SUMMARY_READY'};save();render();toast('已保存');return;}
 if(act==='load-history'){const e=st.history[Number(button.dataset.index)];if(e){st.case=structuredClone(e);save();moveTo('/elder/summary');}return;}
 if(act==='stop-dictation'){if(activeRecognition){activeRecognition.stop();activeRecognition=null;}setRecordingState(false,'录音已结束');return;}
 if(act==='dictate'){dictateTask();return;}
}
let activeRecognition=null,voiceNavCancel=null;
function setRecordingState(active,message,state=active?'listening':'idle'){const button=document.getElementById('voice-task-button'),status=document.getElementById('voice-task-status');if(status)status.textContent=message;if(button){button.dataset.state=state;button.setAttribute('aria-pressed',String(active||state==='preparing'||state==='responding'));button.setAttribute('aria-label',active?'正在听，再点结束':state==='responding'?'正在回应，点击取消':state==='preparing'?'正在准备，点击取消':'点我说话，例如看看今天的药');}}
function cancelVoiceNavigation(){voiceNavCancel?.();}
function announceVoiceNavigation(path){const names={'/elder/today':'今天的药','/elder/setup':'添加用药','/elder/reminders':'用药提醒','/elder/history':'核对记录','/elder/home':'首页','/family/dashboard':'药单核对'},name=names[path]||'操作页面',message=`正在打开${name}`;if(!st.settings.speech||!window.speechSynthesis||typeof window.speechSynthesis.speak!=='function'||typeof SpeechSynthesisUtterance==='undefined'){moveTo(path);setRecordingState(false,`已打开${name}`);return;}cancelVoiceNavigation();stopReading();setRecordingState(false,message,'responding');let settled=false,timer;const finish=()=>{if(settled)return;settled=true;clearTimeout(timer);voiceNavCancel=null;window.speechSynthesis.cancel();moveTo(path);setRecordingState(false,`已打开${name}`);};voiceNavCancel=()=>{if(settled)return;settled=true;clearTimeout(timer);voiceNavCancel=null;window.speechSynthesis.cancel();};try{const u=new SpeechSynthesisUtterance(message);u.lang='zh-CN';u.rate=st.settings.slow?0.78:0.95;u.onend=finish;u.onerror=finish;timer=setTimeout(finish,4500);window.speechSynthesis.speak(u);}catch{finish();}}
function dictateTask(){if(voiceNavCancel){cancelVoiceNavigation();setRecordingState(false,'已取消，再点可重说');return;}if(activeRecognition){const previous=activeRecognition;activeRecognition=null;previous.abort();setRecordingState(false,'已结束，再点可重说');return;}stopReading();const SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRec){setRecordingState(false,'此设备不支持语音，请点按钮','error');return;}try{const r=new SpeechRec();activeRecognition=r;r.lang='zh-CN';r.interimResults=false;r.continuous=false;setRecordingState(false,'正在准备麦克风…','preparing');r.onstart=()=>{if(activeRecognition===r)setRecordingState(true,'正在听您说，再点结束');};r.onresult=e=>{if(activeRecognition!==r)return;const t=e.results?.[0]?.[0]?.transcript?.trim()||'';activeRecognition=null;r.abort();const transcript=document.getElementById('voice-task-transcript');if(transcript){transcript.textContent=t.slice(0,100);transcript.hidden=!t;}setRecordingState(false,'已听到');let path;if(/不记得|记不清|不确定|吃没吃|服没服/.test(t))path='/elder/today';else if(/换药|调整|核对|新旧药单/.test(t))path='/family/dashboard';else if(/添加|录入|拍药盒|药单/.test(t))path='/elder/setup';else if(/提醒/.test(t))path='/elder/reminders';else if(/今天|吃药|服药|用药/.test(t))path='/elder/today';else if(/以前|记录|历史/.test(t))path='/elder/history';else if(/首页|回家|返回/.test(t))path='/elder/home';if(path){announceVoiceNavigation(path);}else setRecordingState(false,'没听懂，再说一次或点按钮','error');};r.onerror=e=>{if(activeRecognition!==r)return;activeRecognition=null;setRecordingState(false,e.error==='not-allowed'?'麦克风未获允许，请点按钮':'识别失败，请再试一次','error');};r.onend=()=>{if(activeRecognition!==r)return;activeRecognition=null;setRecordingState(false,'已结束，再点可重说');};r.start();}catch{activeRecognition=null;setRecordingState(false,'麦克风暂不可用，请点按钮','error');}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.preventDefault();handleAction(el);}const sp=event.target.closest('[data-speak]');if(sp){event.preventDefault();speak(sp.dataset.speak);}});
document.addEventListener('submit',event=>{if(event.target.matches('.source-form')){event.preventDefault();sourceSubmit(event.target);}if(event.target.id==='solo-plan-form'){event.preventDefault();const data=new FormData(event.target);const name=String(data.get('name')||'').trim(),dose=String(data.get('dose')||'').trim(),time=String(data.get('time')||'').trim();if(!name||!dose||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))return toast('请填写药名、每次数量和时间');const old=(st.plan||[]).find(x=>x.id===st.editingPlanId)||st.draftPlan,id=old?.id||`self-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;if(boxPhotoLoading)return toast('照片正在准备，请稍等');if(!pendingBoxPhoto)return toast('请先拍下对应的药盒');st.draftPlan={id,name,dose,time,boxPhoto:pendingBoxPhoto,...(old?.demoCaseId?{demoCaseId:old.demoCaseId,recognitionMode:'curated_example',demo:true}:{})};if(save())moveTo('/elder/confirm-plan');}});
document.addEventListener('change',async event=>{if(event.target.matches('[data-box-photo]')){const file=event.target.files?.[0],status=document.getElementById('box-photo-status');if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type))return toast('请选择 JPG、PNG 或 WebP 照片');if(file.size>12*1024*1024)return toast('照片太大，请选择12MB以内的照片');const version=++boxPhotoVersion;boxPhotoLoading=true;if(status)status.textContent='正在准备照片…';try{const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(version!==boxPhotoVersion||currentPath()!=='/elder/edit-plan')return;const scale=Math.min(1,640/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);pendingBoxPhoto=canvas.toDataURL('image/jpeg',0.78);document.getElementById('box-photo-preview').innerHTML=boxVisual({name:'待核对药物',boxPhoto:pendingBoxPhoto});if(status)status.textContent='照片已准备，请核对药名';}finally{URL.revokeObjectURL(url);}}catch{if(version===boxPhotoVersion&&status)status.textContent='照片无法打开，请重新拍';}finally{if(version===boxPhotoVersion)boxPhotoLoading=false;}return;}if(event.target.matches('[data-field][data-med-id]'))recordField(event.target);if(event.target.matches('[data-file]')){const file=event.target.files?.[0];if(!file)return;const safeTypes=['image/jpeg','image/png','image/webp','application/pdf','text/plain'];if(!safeTypes.includes(file.type)){toast('暂不支持该文件类型，请选择图片、PDF或文本。');return;}if(file.size>5*1024*1024){toast('文件超过5MB，请选择较小文件。');return;}tempFileName=file.name;toast(`已选择“${file.name}”。文件已选中，但尚未接入图片预览和OCR；请使用虚构资料手动输入演示。`);}});
window.addEventListener('hashchange',()=>{if(activeRecognition){activeRecognition.abort();activeRecognition=null;}stopReading();render();window.scrollTo(0,0);});
render();
if(typeof window!=='undefined'&&typeof window.setInterval==='function')window.setInterval(checkReminders,30000);
